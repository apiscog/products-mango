spring.application.name=products
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/products}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:products}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:products}

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.connect-timeout=${SPRING_DATA_REDIS_CONNECT_TIMEOUT:500ms}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:1s}
spring.data.redis.repositories.enabled=false

spring.cache.type=redis
products.cache.current-price-ttl=${CURRENT_PRICE_CACHE_TTL:5m}
products.cache.price-history-ttl=${PRICE_HISTORY_CACHE_TTL:2m}

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,metrics

exchange-rate.primary-url=${EXCHANGE_API_PRIMARY_URL:https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@{date}/v1/currencies/{base}.json}
exchange-rate.fallback-url=${EXCHANGE_API_FALLBACK_URL:https://{date}.currency-api.pages.dev/v1/currencies/{base}.json}
exchange-rate.connect-timeout=${EXCHANGE_API_CONNECT_TIMEOUT:2s}
exchange-rate.read-timeout=${EXCHANGE_API_READ_TIMEOUT:3s}

products.security.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION:file:./config/jwt/generated/dev-public-key.pem}
products.security.jwt.issuer=${JWT_ISSUER:products-challenge-dev}
products.security.jwt.audience=${JWT_AUDIENCE:products-api}
