spring.application.name=products
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/products}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:products}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:products}

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.connect-timeout=${SPRING_DATA_REDIS_CONNECT_TIMEOUT:500ms}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:1s}
spring.data.redis.repositories.enabled=false

spring.cache.type=redis
products.cache.current-price-ttl=${CURRENT_PRICE_CACHE_TTL:5m}
products.cache.price-history-ttl=${PRICE_HISTORY_CACHE_TTL:2m}

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,metrics
