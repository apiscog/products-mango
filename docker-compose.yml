services:
  postgres:
    image: postgres:17-alpine
    container_name: products-postgres
    environment:
      POSTGRES_DB: products
      POSTGRES_USER: products
      POSTGRES_PASSWORD: products
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U products -d products"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/products
      SPRING_DATASOURCE_USERNAME: products
      SPRING_DATASOURCE_PASSWORD: products
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  benchmark:
    image: grafana/k6:1.7.1
    container_name: product-benchmark
    profiles: ["benchmark"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      BASE_URL: ${BASE_URL:-http://app:8080}
      WARMUP_DURATION: ${WARMUP_DURATION:-10s}
      RAMP_UP_DURATION: ${RAMP_UP_DURATION:-15s}
      TEST_DURATION: ${TEST_DURATION:-30s}
      COOLDOWN_DURATION: ${COOLDOWN_DURATION:-10s}
      TARGET_RATE: ${TARGET_RATE:-20}
    volumes:
      - ./performance/products-load-test.js:/scripts/products-load-test.js:ro
    command: ["run", "/scripts/products-load-test.js"]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  postgres-data:
