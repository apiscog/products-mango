services:
  postgres:
    image: postgres:17-alpine
    container_name: products-postgres
    environment:
      POSTGRES_DB: products
      POSTGRES_USER: products
      POSTGRES_PASSWORD: products
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U products -d products"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  redis:
    image: redis:7.4.9-alpine
    container_name: products-redis
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "192mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/products
      SPRING_DATASOURCE_USERNAME: products
      SPRING_DATASOURCE_PASSWORD: products
      EXCHANGE_API_PRIMARY_URL: ${EXCHANGE_API_PRIMARY_URL:-https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@{date}/v1/currencies/{base}.json}
      EXCHANGE_API_FALLBACK_URL: ${EXCHANGE_API_FALLBACK_URL:-https://{date}.currency-api.pages.dev/v1/currencies/{base}.json}
      EXCHANGE_API_CONNECT_TIMEOUT: ${EXCHANGE_API_CONNECT_TIMEOUT:-2s}
      EXCHANGE_API_READ_TIMEOUT: ${EXCHANGE_API_READ_TIMEOUT:-3s}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_PUBLIC_KEY_LOCATION: file:/run/config/products-public-key.pem
      JWT_ISSUER: ${JWT_ISSUER:-products-challenge-dev}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-products-api}
    volumes:
      - ./config/jwt/generated/dev-public-key.pem:/run/config/products-public-key.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --output-document=- http://localhost:8080/actuator/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  k6:
    image: grafana/k6:1.7.1
    container_name: product-k6-load-test
    profiles: ["benchmark"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      BASE_URL: ${BASE_URL:-http://app:8080}
      PRODUCT_CREATION_VUS: ${PRODUCT_CREATION_VUS:-100}
      PRICE_QUERY_VUS: ${PRICE_QUERY_VUS:-500}
      HISTORY_QUERY_VUS: ${HISTORY_QUERY_VUS:-500}
      ACCESS_TOKEN: ${ACCESS_TOKEN:-}
    volumes:
      - ./performance/products-load-test.js:/scripts/products-load-test.js:ro
      - ./performance/run-k6-load-test.sh:/scripts/run-k6-load-test.sh:ro
    entrypoint: ["/bin/sh", "/scripts/run-k6-load-test.sh"]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  postgres-data:
